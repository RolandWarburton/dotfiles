# Never suspend idle ALSA outputs. Ported from main.lua.d/51-disable-suspend.lua,
# which WirePlumber 0.5 no longer reads.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
