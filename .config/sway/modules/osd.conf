# On-screen bar (wob) for hardware keys: volume + brightness.
#
# A fifo at $XDG_RUNTIME_DIR/wob.sock is fed levels (0-100) by the `volume`
# and `brightness` scripts (~/.local/scripts) and drawn by wob. `tail -f`
# keeps the fifo open so writes never block. Bar styling: ~/.config/wob/wob.ini.
# Keys were identified with `wev`; --locked keeps them working while the screen
# is locked. This `exec` runs once at startup (not on reload).
exec rm -f "$XDG_RUNTIME_DIR/wob.sock" && mkfifo -m 600 "$XDG_RUNTIME_DIR/wob.sock" && tail -f "$XDG_RUNTIME_DIR/wob.sock" | wob

# volume
bindsym --locked XF86AudioRaiseVolume exec volume up
bindsym --locked XF86AudioLowerVolume exec volume down
bindsym --locked XF86AudioMute        exec volume mute

# brightness
bindsym --locked XF86MonBrightnessUp   exec brightness up
bindsym --locked XF86MonBrightnessDown exec brightness down
