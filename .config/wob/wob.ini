# wob — on-screen level bar (volume). Run `wob -vv` to see all defaults.
# Colors are RRGGBB[AA]; palette mirrors .config/sway/modules/theme.conf.
timeout = 1000
max = 100

anchor = top
margin = 60
width = 320
height = 32
border_offset = 2
border_size = 2
bar_padding = 3

background_color = 2F333EE0
border_color = 285577FF
bar_color = 285577FF
