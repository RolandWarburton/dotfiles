# Rebind ctrl+b to ctrl+a like screen
unbind C-b
set -g prefix C-a

# unbind ctrl + page keys (instead use <prefix> N)
unbind -n C-pageup
unbind -n C-pagedown

# Enable focus events
# When enabled, focus events are requested from the terminal if supported and passed through to applications running in tmux.
# I may use these for the following events in the future:
# * pane-focus-in
# * pane-focus-out
# * pane-exited (Run when the program running in a pane exits.)
set -g focus-events on

# Hooks
set-hook -g pane-focus-in "run-shell '(P=\"$HOME/.tmux-pane-id\"; echo #{pane_index} >> \$P && tail -n 10 \$P > \$P.tmp && mv \$P.tmp \$P)'"

