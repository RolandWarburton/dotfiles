# Settings

# vim like navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set the status bar with the IP
set -g status-right-length 85

# https://stackoverflow.com/questions/18600188/home-end-keys-do-not-work-in-tmux
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# This change allows applications in SSH to write to the system clipboard using OSC 52
set -s set-clipboard on

# Tell TMUX that our terminal supports HEX color codes
set -ag terminal-features ",foot:clipboard:RGB"
set -as terminal-overrides ",foot:RGB"

# set -g allow-passthrough on
set -s copy-command 'wl-copy'

# FIX for ^[OH ^[OF and such (home and end keys)
# Better to have it then not have it i think
set-window-option -g xterm-keys on

setw -g mode-keys vi

# big scrollback energy
set -g history-limit 10000

setw -g mode-keys vi

# scrolling scrolls text up and not scroll through history
# For some reason this ENABLES scrolling but not scroll through history which is what i want (need both off then on)
#set -g mouse off
set -g mouse on
unbind -n -Tcopy-mode-vi MouseDragEnd1Pane

#set the ctrl+mod t clock to 12 hour
tmux_conf_theme_clock_style='12'
set-window-option -g clock-mode-style 12

# Sync panes up
bind r setw synchronize-pane
bind -n C-Pageup next-window
bind -n C-Pagedown previous-window

#  __  __ _
# |  \/  (_)___  ___
# | |\/| | / __|/ __|
# | |  | | \__ \ (__
# |_|  |_|_|___/\___|
#
# Misc

# split window to focused window current directory
bind-key '"' split-window -c "#{pane_current_path}"
bind-key '%' split-window -h -c "#{pane_current_path}"

# VIM TMUX NAVIGATOR
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key 'h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key 'j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key 'k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key 'l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
